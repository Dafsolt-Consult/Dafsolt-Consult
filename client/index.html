<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the Android status/nav
         bars in standalone/TWA mode, which the layout needs so its
         safe-area-inset padding actually has something to react to. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E3192" />
    <title>Dafsolt BOS for School</title>
    <meta
      name="description"
      content="Dafsolt BOS for School is the complete operating system for African schools — Academics, Finance, CBT, HR, Communication, Operations and Analytics, all connected in one place."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dafsolt BOS" />
    <meta property="og:title" content="Dafsolt BOS for School" />
    <meta
      property="og:description"
      content="The complete operating system for your school — Academics, Finance, CBT, HR and more, all connected in one place."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dafsolt BOS for School" />
    <meta
      name="twitter:description"
      content="The complete operating system for your school — Academics, Finance, CBT, HR and more, all connected in one place."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- iOS Safari doesn't read display/icons from the web manifest — these
         are what actually make "Add to Home Screen" behave like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dafsolt BOS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Covers the marketing-page flash for a returning logged-in user: the
         prerendered markup inside #root below is always the public
         LandingPage (baked in at build time for SEO/crawlers), but
         main.tsx does a full createRoot replace rather than a hydrate, so
         without this a signed-in TWA user would briefly see the landing
         page before the dashboard swaps in. This script (synchronous, runs
         before #root's prerendered content is visible) hides the splash
         immediately if there's no stored session, so logged-out visitors
         and crawlers see the normal landing page with no extra flash;
         main.tsx removes it once the real app has painted. -->
    <div
      id="native-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2e3192;
      "
    >
      <img
        src="/icons/icon-192.png"
        width="72"
        height="72"
        alt=""
        style="border-radius: 16px; animation: native-splash-pulse 1.4s ease-in-out infinite"
      />
      <style>
        @keyframes native-splash-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.55; }
        }
      </style>
      <script>
        if (!localStorage.getItem("dafsolt.accessToken")) {
          document.getElementById("native-splash").style.display = "none";
        }
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
